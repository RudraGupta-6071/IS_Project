project_id = "iitkgp-reviews"
[api]
enabled = true
port = 54321
schemas = ["public"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[local_smtp]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/code.html"
[auth.email.template.confirmation]
subject = "Your verification code"
content_path = "./supabase/templates/code.html"
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/check_student_signup"
